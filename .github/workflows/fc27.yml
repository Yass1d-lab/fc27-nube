name: FC27 nube

on:
  # Boton "Run workflow" para probar a mano
  workflow_dispatch:
  # Martes a jueves, 10:07 a 22:07 hora de Panama, cada 2 h.
  # GitHub usa hora UTC (Panama = UTC-5), por eso las de 20:07 y 22:07 caen al dia siguiente en UTC.
  # GitHub a veces arranca 5-20 min tarde: es normal.
  schedule:
    - cron: "7 15,17,19,21,23 * * 2,3,4"
    - cron: "7 1,3 * * 3,4,5"

concurrency:
  group: fc27
  cancel-in-progress: false

permissions:
  contents: write   # para guardar los resultados en la rama "datos" (la tarea de Claude los lee de ahi)

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Panama
      FC27_NUBE: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chrome
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Recuperar memoria de la lectura anterior
        uses: actions/cache/restore@v4
        with:
          path: estado_nube
          key: fc27-estado-${{ github.run_id }}
          restore-keys: fc27-estado-

      - name: Preparar memoria
        run: python nube.py antes

      - name: Pruebas basicas (sin red)
        run: python pruebas.py

      - name: Leer FUT.GG
        run: python recolectar.py

      - name: Guardar memoria
        if: always()
        run: python nube.py despues

      - name: Subir memoria a la cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado_nube
          key: fc27-estado-${{ github.run_id }}

      # Solo precios publicos de FUT.GG (sin GG Club). Rama "datos" con un unico commit (se reemplaza cada vez).
      - name: Publicar resultados en la rama datos
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub
          for f in ultimo.json raw.txt resumen_corto.txt candidatas_confirmadas.json amplio_candidatas.json amplio_analisis.json amplio.json; do
            [ -f "$f" ] && cp "$f" /tmp/pub/
          done
          echo "$(date +%s) $(date '+%Y-%m-%d %H:%M') resultado=${{ job.status }}" > /tmp/pub/hora.txt
          cd /tmp/pub
          git init -q -b datos
          git add -A
          git -c user.name=fc27-nube -c user.email=fc27-nube@users.noreply.github.com commit -qm "lectura $(date '+%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" datos
