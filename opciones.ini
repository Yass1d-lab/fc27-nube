; Ajustes que cambia Claude (no hay claves ni token aqui). config.ini sigue siendo tuyo.
[confirmar]
max_cartas = 35
precio_max = 150000
ganancia_min = 300
margen_min_pct = 4
ventas_min = 10
pausa = 4
; precio de compra realista para calcular la ganancia: p10, p25 (por defecto) o p50 (mediana de ventas). El BIN minimo casi nunca se consigue.
compra_realista = p25
; ultima venta de hace mas de estos minutos = poca liquidez (no da ✅)
recencia_min = 180
; horas sin repetir el mismo aviso ✅ y maximo de avisos ✅ por lectura
dedupe_h = 6
max_avisos = 6

[ventana]
; oculta = Chrome sin ventana (por defecto). visible = como antes (minimizada).
modo = oculta

[reglas]
; --- alertas de Telegram ---
; horas sin repetir la misma alerta; maximo de lineas 📌 por mensaje; los 📌 de cartas mas caras que esto no se avisan
dedupe_h = 6
max_pines = 6
cambio_max_precio = 150000
; --- fodder ---
fodder_media_min = 84
fodder_media_max = 90
fodder_min_cartas = 5
fodder_ref_horas = 36
; --- regla de 3 dias sin vender ---
estancada_dias = 3
; --- listado amplio (mas opciones) ---
; caida minima bajo su mediana para ser candidata (tus datos: las mejores senales son de 8 a 15%)
amp_baja_min = 8
; cuantas candidatas se guardan para confirmar (antes 40)
amp_max_candidatas = 120
; aviso de espacios vacios: si hay fodder barato y tienes menos flips que esto en la Transfer List
ocioso_flips = 20
